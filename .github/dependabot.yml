version: 2
updates:
  # Rust dependencies. Security alerts are raised against `Cargo.lock`,
  # so the lockfile needs to be kept up to date, not only the manifest.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request for all the compatible bumps, so the noise stays low
      # and only the breaking ones need individual review.
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch

  # The workflow actions themselves. Without this they silently rot until a
  # runner image or a Node runtime is retired and CI breaks.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
