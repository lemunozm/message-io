# Based on crossterm repository
name: message-io ci

on:
  # Build master branch only
  push:
    branches:
      - master

  # Build pull requests targeting master branch only
  pull_request:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.rust }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform that fails. Otherwise the first failing job
      # cancels the rest of the matrix and hides the other failures.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        rust: [stable, nightly]
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy
    - name: Cache Dependencies
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.rust }}
    - name: Toolchain Information
      run: |
        rustc --version
        rustfmt --version
        rustup --version
        cargo --version
    # `.rustfmt.toml` enables unstable options, so only nightly can check it.
    - name: Check Formatting
      if: matrix.rust == 'nightly'
      run: cargo fmt --all -- --check
    # Only on stable. Nightly adds new lints continuously, and a red CI caused
    # by a toolchain release instead of by a change in this repository is noise.
    - name: Clippy
      if: matrix.rust == 'stable'
      run: cargo clippy -- -D clippy::all
    - name: Check build
      run: cargo build
    - name: Check test and examples
      run: cargo test -- --nocapture
    - name: Check benchmarks (only compilation)
      run: cargo bench --no-run
    - name: Test Packaging
      if: matrix.rust == 'stable'
      run: cargo package

  test-cross:
    # websocket requires openssl that complicates cross compilation
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-unknown-linux-gnu
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Check build
        run: cross build --target ${{ matrix.target }}
      - name: Check test and examples
        run: cross test --target ${{ matrix.target }}
      - name: Check benchmarks (only compilation)
        run: cross bench --target ${{ matrix.target }} --no-run
